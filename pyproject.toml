[project]
name = "program-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.16.0",
    "jsonpointer>=3.12",
    "langchain>=1.5.2",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.2",
    "langchain-openai>=1.8.5",
    "pip>=26.3",
    "pyopenssl>=26.4.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
program-2 = "program_2:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
